spring:
  application:
    name: moamoa
  messages:
    # Korean lives in the base bundle; never replace it with the server's locale.
    fallback-to-system-locale: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/moamoa}
    username: ${DATABASE_USER:moamoa}
    password: ${DATABASE_PASSWORD:moamoa-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt-secret: ${JWT_SECRET:}
  secure-cookie: ${SECURE_COOKIE:false}
  mail-from: ${MAIL_FROM:moamoa@example.test}
  admin-email: ${ADMIN_EMAIL:admin@example.test}
  scheduling-enabled: ${SCHEDULING_ENABLED:true}
  seoul-api-key: ${SEOUL_API_KEY:}
  sync-on-start: ${SYNC_ON_START:false}
  kocca-api-key: ${KOCCA_API_KEY:}
  kocca-enabled: ${KOCCA_ENABLED:true}
  kocca-max-pages: ${KOCCA_MAX_PAGES:200}
