<!doctype html><html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: nav}"></header><main class="auth-shell"><div class="auth-box"><p class="eyebrow"><span th:text="#{auth.eyebrow}">당신의 취향을 모으는 곳</span></p><h1><span th:text="#{auth.forgot}">비밀번호를 잊으셨나요?</span></h1><p><span th:text="#{auth.resetIntro}">가입한 이메일로 재설정 링크를 보내드려요.</span></p><form data-api="/api/auth/forgot-password" data-redirect=""><label for="email"><span th:text="#{detail.email}">이메일</span></label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><p class="form-message" role="status"></p><button class="button"><span th:text="#{auth.resetLink}">재설정 링크 받기</span></button></form><div class="auth-links"><a href="/auth/login"><span th:text="#{auth.back}">로그인으로 돌아가기</span></a></div></div></main><footer th:replace="~{layout :: footer}"></footer></body></html>
