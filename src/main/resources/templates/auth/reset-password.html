<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: nav}"></header><main class="auth-shell"><div class="auth-box"><p class="eyebrow">당신의 취향을 모으는 곳</p><h1>새 비밀번호 설정</h1><p>안전한 비밀번호로 다시 시작하세요.</p><form data-api="/api/auth/reset-password" data-redirect="/auth/login"><input type="hidden" name="token" th:value="${token}"><label for="password">새 비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="64" required><p class="form-message" role="status"></p><button class="button">비밀번호 변경</button></form><div class="auth-links"><a href="/auth/forgot-password">재설정 링크 다시 요청</a></div></div></main><footer th:replace="~{layout :: footer}"></footer></body></html>
