<!doctype html><html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: nav}"></header><main class="auth-shell"><div class="auth-box"><p class="eyebrow"><span th:text="#{auth.eyebrow}">당신의 취향을 모으는 곳</span></p><h1><span th:text="#{auth.resetTitle}">새 비밀번호 설정</span></h1><p><span th:text="#{auth.resetSafe}">안전한 비밀번호로 다시 시작하세요.</span></p><form data-api="/api/auth/reset-password" data-redirect="/auth/login"><input type="hidden" name="token" th:value="${token}"><label for="password"><span th:text="#{auth.newPassword}">새 비밀번호</span></label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="64" required><p class="form-message" role="status"></p><button class="button"><span th:text="#{auth.change}">비밀번호 변경</span></button></form><div class="auth-links"><a href="/auth/forgot-password"><span th:text="#{auth.retry}">재설정 링크 다시 요청</span></a></div></div></main><footer th:replace="~{layout :: footer}"></footer></body></html>
