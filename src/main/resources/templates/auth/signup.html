<!doctype html><html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: nav}"></header><main class="auth-shell"><div class="auth-box"><p class="eyebrow"><span th:text="#{auth.eyebrow}">당신의 취향을 모으는 곳</span></p><h1><span th:text="#{auth.signupTitle}">좋아하는 경험을 모아보세요</span></h1><p><span th:text="#{auth.signupIntro}">관심 있는 행사를 저장하고 새 소식을 받아보세요.</span></p><form data-api="/api/auth/signup" data-redirect="/auth/login"><label for="nickname"><span th:text="#{auth.nickname}">닉네임</span></label><input id="nickname" name="nickname" autocomplete="nickname" maxlength="40" required><label for="email"><span th:text="#{detail.email}">이메일</span></label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><label for="password"><span th:text="#{auth.password}">비밀번호</span></label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="64" required><p class="hint"><span th:text="#{auth.limit}">10~64자, UTF-8 기준 최대 72바이트</span></p><p class="form-message" role="status"></p><button class="button"><span th:text="#{auth.signup}">회원가입</span></button></form><div class="auth-links"><a href="/auth/login"><span th:text="#{auth.existing}">이미 계정이 있나요? 로그인</span></a></div></div></main><footer th:replace="~{layout :: footer}"></footer></body></html>
