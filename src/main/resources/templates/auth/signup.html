<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: nav}"></header><main class="auth-shell"><div class="auth-box"><p class="eyebrow">당신의 취향을 모으는 곳</p><h1>좋아하는 경험을 모아보세요</h1><p>관심 있는 행사를 저장하고 새 소식을 받아보세요.</p><form data-api="/api/auth/signup" data-redirect="/auth/login"><label for="nickname">닉네임</label><input id="nickname" name="nickname" autocomplete="nickname" maxlength="40" required><label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="64" required><p class="hint">10~64자, UTF-8 기준 최대 72바이트</p><p class="form-message" role="status"></p><button class="button">회원가입</button></form><div class="auth-links"><a href="/auth/login">이미 계정이 있나요? 로그인</a></div></div></main><footer th:replace="~{layout :: footer}"></footer></body></html>
