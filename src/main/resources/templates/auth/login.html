<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: nav}"></header><main class="auth-shell"><div class="auth-box"><p class="eyebrow">당신의 취향을 모으는 곳</p><h1>다시 만나 반가워요</h1><p>로그인하고 마음에 드는 행사를 모아보세요.</p><form data-api="/api/auth/login" data-redirect="/contests"><label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="64" required><p class="form-message" role="status"></p><button class="button">로그인</button></form><div class="auth-links"><a href="/auth/forgot-password">비밀번호를 잊으셨나요?</a><a href="/auth/signup">처음이라면 회원가입</a></div></div></main><footer th:replace="~{layout :: footer}"></footer></body></html>
