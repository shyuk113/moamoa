<!doctype html><html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: nav}"></header><main class="auth-shell"><div class="auth-box"><p class="eyebrow"><span th:text="#{auth.eyebrow}">당신의 취향을 모으는 곳</span></p><h1><span th:text="#{auth.welcome}">다시 만나 반가워요</span></h1><p><span th:text="#{auth.intro}">로그인하고 마음에 드는 행사를 모아보세요.</span></p><form data-api="/api/auth/login" data-redirect="/contests"><label for="email"><span th:text="#{detail.email}">이메일</span></label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><label for="password"><span th:text="#{auth.password}">비밀번호</span></label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="64" required><p class="form-message" role="status"></p><button class="button"><span th:text="#{nav.login}">로그인</span></button></form><div class="auth-links"><a href="/auth/forgot-password"><span th:text="#{auth.forgot}">비밀번호를 잊으셨나요?</span></a><a href="/auth/signup"><span th:text="#{auth.join}">처음이라면 회원가입</span></a></div></div></main><footer th:replace="~{layout :: footer}"></footer></body></html>
