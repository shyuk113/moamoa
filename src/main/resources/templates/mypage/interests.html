<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: nav}"></header><main class="settings"><div class="page-heading"><p class="eyebrow">나에게 맞는 소식만</p><h1>관심분야·알림</h1></div><form data-api="/api/interests" data-method="PUT" data-kind="interests"><fieldset><legend>관심 있는 분야를 골라주세요</legend><label class="interest-choice" th:each="c:${categories}" th:if="${c.name() != 'OTHER'}"><input type="checkbox" name="categories" th:value="${c}" th:checked="${selected.contains(c)}"><span th:text="${c.label}"></span></label></fieldset><fieldset><legend>새 행사 소식을 받는 주기</legend><label class="radio-row"><input type="radio" name="frequency" value="IMMEDIATE" th:checked="${frequency.name() == 'IMMEDIATE'}">새로 등록되면 바로 받기</label><label class="radio-row"><input type="radio" name="frequency" value="WEEKLY" th:checked="${frequency.name() == 'WEEKLY'}">매주 월요일 오전 9시에 모아 받기</label><p class="hint">즐겨찾기·관심분야 행사의 마감 또는 종료 3일 전 알림은 별도로 발송합니다.<br>공모전 데이터는 제공기관 승인 후 연동 예정입니다.</p></fieldset><p class="form-message" role="status"></p><button class="button">설정 저장</button></form></main><footer th:replace="~{layout :: footer}"></footer></body></html>
