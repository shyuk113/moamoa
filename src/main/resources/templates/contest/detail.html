<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: nav}"></header><main><a class="back" href="/contests">← 행사 둘러보기</a><section class="detail"><div class="detail-poster" th:classappend="${event.category.name().toLowerCase()}"><img referrerpolicy="no-referrer" th:if="${event.imageUrl != null}" th:src="${event.imageUrl}" th:alt="${event.title}"><span th:if="${event.imageUrl == null}" th:text="${event.category.label}"></span></div><div><p class="eyebrow" th:text="|${event.category.label} · ${event.district ?: '서울'}|"></p><h1 th:text="${event.title}"></h1><span class="badge" th:text="|${event.dateLabel} ${event.dayBadge(today)}|"></span><dl><dt>행사 기간</dt><dd th:text="${event.period}"></dd><dt>장소</dt><dd th:text="${event.place ?: '원본 공고 확인'}"></dd><dt>참여 대상</dt><dd th:text="${event.eligibility ?: '원본 공고 확인'}"></dd><dt>이용 요금</dt><dd th:text="${event.fee ?: '원본 공고 확인'}"></dd></dl><div class="detail-actions"><a th:if="${event.originalUrl != null}" class="button" th:href="${event.originalUrl}" target="_blank" rel="noopener noreferrer">원본 공고 보기 ↗</a><button class="button secondary" th:attr="data-favorite=${event.id},data-saved=${favorite},aria-pressed=${favorite}" th:text="${favorite ? '♥ 모아둠' : '♡ 모아두기'}"></button></div><p class="hint">방문·신청 전 원본 공고에서 일정과 예약 여부를 확인해주세요.</p></div></section><section class="description"><h2>행사 소개</h2><p th:text="${#strings.isEmpty(#strings.trim(event.description)) ? '자세한 내용은 원본 공고에서 확인해주세요.' : event.description}"></p><p class="source" th:text="|출처: 서울특별시 서울문화포털 · 원본 분류: ${event.originalCategory}|"></p></section></main><footer th:replace="~{layout :: footer}"></footer></body></html>
