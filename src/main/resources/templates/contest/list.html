<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: nav}"></header><main><div class="page-heading"><p class="eyebrow">나의 다음 일정을 찾아서</p><h1>행사 둘러보기</h1><p>전시, 박람회, 축제. 취향과 일정에 맞는 경험을 찾아보세요.</p></div>
<form action="/contests" class="filters" th:object="${condition}">
<div class="filter-search"><label for="keyword">검색어</label><input id="keyword" th:field="*{keyword}" maxlength="200" placeholder="행사 이름으로 검색"></div>
<div><label for="category">분야</label><select id="category" th:field="*{category}"><option value="">전체 분야</option><option th:each="c:${categories}" th:value="${c}" th:text="${c.label}"></option></select></div>
<div><label for="district">지역</label><select id="district" th:field="*{district}"><option value="">서울 전체</option><option th:each="d:${#strings.arraySplit('강남구,강동구,강북구,강서구,관악구,광진구,구로구,금천구,노원구,도봉구,동대문구,동작구,마포구,서대문구,서초구,성동구,성북구,송파구,양천구,영등포구,용산구,은평구,종로구,중구,중랑구',',')}" th:value="${d}" th:text="${d}"></option></select></div>
<div><label for="from">기간 시작</label><input id="from" type="date" th:field="*{from}"></div><div><label for="to">기간 끝</label><input id="to" type="date" th:field="*{to}"></div>
<div><label for="onOffline">참여 방식</label><select id="onOffline" th:field="*{onOffline}"><option value="">전체</option><option value="OFFLINE">현장</option><option value="ONLINE">온라인</option><option value="BOTH">온·오프라인</option></select></div>
<label class="check"><input type="checkbox" th:field="*{freeOnly}">무료만 보기</label><button class="button">찾아보기</button><a href="/contests" class="reset">초기화</a></form>
<div class="results-heading"><p>총 <strong th:text="${result.totalElements}"></strong>개의 행사</p><span>새로 등록된 순 · 종료된 행사 제외</span></div><div th:replace="~{layout :: cards}"></div>
<nav class="pagination" aria-label="검색 결과 페이지"><a th:if="${result.hasPrevious()}" th:href="@{/contests(page=${result.number-1},keyword=${condition.keyword},category=${condition.category},district=${condition.district},from=${condition.from},to=${condition.to},onOffline=${condition.onOffline},freeOnly=${condition.freeOnly})}">← 이전</a><span th:text="|${result.number+1} / ${result.totalPages == 0 ? 1 : result.totalPages}|"></span><a th:if="${result.hasNext()}" th:href="@{/contests(page=${result.number+1},keyword=${condition.keyword},category=${condition.category},district=${condition.district},from=${condition.from},to=${condition.to},onOffline=${condition.onOffline},freeOnly=${condition.freeOnly})}">다음 →</a></nav></main><footer th:replace="~{layout :: footer}"></footer></body></html>
