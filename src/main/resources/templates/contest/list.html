<!doctype html><html lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head}"></head><body><header th:replace="~{layout :: nav}"></header><main><div class="page-heading"><p class="eyebrow"><span th:text="#{search.eyebrow}">나의 다음 일정을 찾아서</span></p><h1><span th:text="#{nav.events}">행사 둘러보기</span></h1><p><span th:text="#{search.intro}">전시, 박람회, 축제. 취향과 일정에 맞는 경험을 찾아보세요.</span></p></div>
<form action="/contests" class="filters" th:object="${condition}">
<div class="filter-search"><label for="keyword"><span th:text="#{search.keyword}">검색어</span></label><input id="keyword" th:field="*{keyword}" maxlength="200" placeholder="행사 이름으로 검색" th:placeholder="#{search.placeholder}"></div>
<div><label for="category"><span th:text="#{search.category}">분야</span></label><select id="category" th:field="*{category}"><option value="" th:text="#{search.allCategories}">전체 분야</option><option th:each="c:${categories}" th:value="${c}" th:text="${@eventLabels.category(c, #locale)}"></option></select></div>
<div><label for="district"><span th:text="#{search.district}">지역</span></label><select id="district" th:field="*{district}"><option value="" th:text="#{search.allDistricts}">서울 전체</option><option th:each="d:${#strings.arraySplit('강남구,강동구,강북구,강서구,관악구,광진구,구로구,금천구,노원구,도봉구,동대문구,동작구,마포구,서대문구,서초구,성동구,성북구,송파구,양천구,영등포구,용산구,은평구,종로구,중구,중랑구',',')}" th:value="${d}" th:text="${@eventLabels.district(d,#locale)}"></option></select></div>
<div><label for="from"><span th:text="#{search.from}">기간 시작</span></label><input id="from" type="date" th:field="*{from}"></div><div><label for="to"><span th:text="#{search.to}">기간 끝</span></label><input id="to" type="date" th:field="*{to}"></div>
<div><label for="onOffline"><span th:text="#{search.mode}">참여 방식</span></label><select id="onOffline" th:field="*{onOffline}"><option value="" th:text="#{search.all}">전체</option><option value="OFFLINE" th:text="#{search.offline}">현장</option><option value="ONLINE" th:text="#{search.online}">온라인</option><option value="BOTH" th:text="#{search.both}">온·오프라인</option></select></div>
<label class="check"><input type="checkbox" th:field="*{freeOnly}"><span th:text="#{search.free}">무료만 보기</span></label><button class="button"><span th:text="#{search.submit}">찾아보기</span></button><a href="/contests" class="reset"><span th:text="#{search.reset}">초기화</span></a></form>
<div class="results-heading"><p><span th:text="#{search.total}">총</span><strong th:text="${result.totalElements}"></strong><span th:text="#{search.count}">개의 행사</span></p><span><span th:text="#{search.order}">새로 등록된 순 · 종료된 행사 제외</span></span></div><div th:replace="~{layout :: cards}"></div>
<nav class="pagination" aria-label="검색 결과 페이지"><a th:if="${result.hasPrevious()}" th:href="@{/contests(page=${result.number-1},keyword=${condition.keyword},category=${condition.category},district=${condition.district},from=${condition.from},to=${condition.to},onOffline=${condition.onOffline},freeOnly=${condition.freeOnly})}"><span th:text="#{action.previous}">← 이전</span></a><span th:text="|${result.number+1} / ${result.totalPages == 0 ? 1 : result.totalPages}|"></span><a th:if="${result.hasNext()}" th:href="@{/contests(page=${result.number+1},keyword=${condition.keyword},category=${condition.category},district=${condition.district},from=${condition.from},to=${condition.to},onOffline=${condition.onOffline},freeOnly=${condition.freeOnly})}"><span th:text="#{action.next}">다음 →</span></a></nav></main><footer th:replace="~{layout :: footer}"></footer></body></html>
