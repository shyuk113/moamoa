name: moamoa
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moamoa
      POSTGRES_USER: moamoa
      POSTGRES_PASSWORD: moamoa-local
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["moamoa-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moamoa"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:v1.29
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  moamoa-db:
